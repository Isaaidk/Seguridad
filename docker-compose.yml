version: '3.8'

services:
  # --- BASE DE DATOS DE KEYCLOAK (El archivador de usuarios) ---
  keycloak-db:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak_admin
      POSTGRES_PASSWORD: keycloak_password
    networks:
      - red-segura

  # --- KEYCLOAK (El guardia del pasaporte, SSO y MFA) ---
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak_admin
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password123
      KC_HOSTNAME_STRICT: "false"          
      KC_PROXY_HEADERS: "xforwarded"
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db
    networks:
      - red-segura

  # --- HASHICORP VAULT (La caja fuerte / KMS) ---
  vault:
    image: hashicorp/vault:1.15.4
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "llave-maestra-vault"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - red-segura

  # --- BASE DE DATOS SISTEMA A ---
  db-sistema-a:
    image: postgres:15
    environment:
      POSTGRES_DB: db_sistema_a
      POSTGRES_USER: user_a
      POSTGRES_PASSWORD: password_a
    ports:
      - "5433:5432"
    networks:
      - red-segura

  # --- BASE DE DATOS SISTEMA B ---
  db-sistema-b:
    image: postgres:15
    environment:
      POSTGRES_DB: db_sistema_b
      POSTGRES_USER: user_b
      POSTGRES_PASSWORD: password_b
    ports:
      - "5434:5432"
    networks:
      - red-segura

  # --- SONARQUBE (El inspector de código) ---
  sonarqube:
    image: sonarqube:lts-community
    ports:
      - "9000:9000"
    networks:
      - red-segura

networks:
  red-segura:
    driver: bridge